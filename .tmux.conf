# ==========================================
# 1. 前綴鍵與基本設定 (Prefix Settings)
# ==========================================
# 修改前綴鍵為 Ctrl + a (避免與 Vim 衝突，更好按)
set -g prefix C-a
unbind C-b
bind C-a send-prefix
 
# 快捷鍵：按 Prefix + r 重新載入設定檔，並在狀態列提示
bind r source-file ~/.tmux.conf \; display-message "Tmux 設定檔已重新載入！"
 
# 開啟 256 色與真彩色支持，確保終端機顏色不失真 (已修正 Unknown flag 錯誤)
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"
 
# 提高歷史滾動行數限制 (預設太小，改成 50000 行方便看長文本)
set -g history-limit 50000
 
# ==========================================
# 2. 視窗與面板操作 (Windows & Panes)
# ==========================================
# 修改分屏快捷鍵：| 為左右分屏，- 為上下分屏，並保持在當前目錄
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %
 
# Vim 風格面板切換 (按 Alt + h/j/k/l 直接切換面板，免按 Prefix)
bind -n M-h select-pane -L
bind -n M-j select-pane -D
bind -n M-k select-pane -U
bind -n M-l select-pane -R
 
# Vim 風格面板大小調整 (按住 Prefix 後，按 H/J/K/L 每次調整 5 格)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
 
# ==========================================
# 3. 滑鼠與滾動優化 (Mouse & Scrolling)
# ==========================================
# 開啟滑鼠全面支持 (支援滾動、點擊切換、拖曳調整大小)
set -g mouse on
 
# 讓滑鼠滾輪更靈敏：在複製模式中，滾動一次捲動 3 行
bind -T copy-mode-vi WheelUpPane send -N 3 -X scroll-up
 


